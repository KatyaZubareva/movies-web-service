<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="movies — сервис, который помогает выбрать фильм на вечер">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#141414; --panel:#1b1b1b; --panel-2:#222; --inset:#111; --line:#2a2a2a; --line-2:#333;
  --fg:#f2f2f2; --fg-2:#cfcfcf; --muted:#8c8c8c; --faint:#666;
  --accent:#5fd06a; --accent-ink:#0d1a0f; --star:#f7c325;
  --ph:#5e5e5e; --foot:#0f0f0f;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
svg{flex:none}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);transition:background .2s,box-shadow .2s,border-color .2s;border-bottom:1px solid transparent}
.hdr.stuck{background:rgba(20,20,20,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:#232323;box-shadow:0 8px 24px -16px rgba(0,0,0,.8)}
.hdr .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:96px;transition:height .2s}
.hdr.stuck .wrap{height:72px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{display:block;width:26px;height:26px;border-radius:50%;background:var(--accent)}
.pills{display:flex;gap:4px;padding:5px;border-radius:999px;background:#101010;border:1px solid #232323}
.pills a{height:36px;display:inline-flex;align-items:center;padding:0 18px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.pills a:hover{color:var(--fg)}
.pills a.on{background:#262626;color:var(--fg)}
.pills .sbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);margin-right:-4px;overflow:hidden;transition:width .2s,opacity .2s,margin .2s}
.pills .sbtn:hover{background:#262626;color:var(--fg)}
.pills .sbtn[data-hide]{width:0;opacity:0;margin-right:-4px;pointer-events:none}
.hicons{justify-self:end;display:flex;gap:14px;color:var(--fg-2)}
.hicons button{width:28px;height:28px;display:grid;place-items:center}
@media (max-width:820px){
  .hdr .wrap{grid-template-columns:1fr auto;height:auto;padding-block:16px;row-gap:12px}
  .pills{grid-column:1/-1;grid-row:2;overflow-x:auto;justify-self:start;max-width:100%}
  .pills a{padding:0 14px}
}

.biglogo{display:flex;justify-content:center;align-items:center;gap:14px;padding-block:48px 72px;font-weight:800;font-size:clamp(36px,5vw,48px);letter-spacing:-.03em}
.biglogo i{display:block;width:1.05em;height:1.05em;border-radius:50%;background:var(--accent)}
@media (max-width:640px){.biglogo{padding-block:24px 36px}}

.panel{background:var(--panel);border:1px solid #232323;border-radius:12px;padding:clamp(20px,3.4vw,40px)}
.finder{display:grid;gap:18px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.finder h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#141414;border:1px solid #2a2a2a}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:#2a2a2a;color:var(--fg)}
.srow{display:flex;gap:10px}
.sfield{flex:1;min-width:0;position:relative;display:block}
.sfield > svg{position:absolute;left:16px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.sfield input{width:100%;height:52px;padding:0 48px 0 46px;border-radius:12px;border:1px solid #2c2c2c;background:#141414;color:var(--fg);font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
.sfield input::-webkit-search-cancel-button{display:none}
.sfield input::placeholder{color:#707070}
.sfield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(95,208,106,.12)}
.sclear{position:absolute;right:10px;top:50%;translate:0 -50%;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sclear:hover{background:#262626;color:var(--fg)}
.fbtn{height:52px;padding:0 18px;border-radius:12px;border:1px solid #2c2c2c;background:#141414;display:inline-flex;align-items:center;gap:10px;color:var(--fg-2);font-size:14px;font-weight:600;white-space:nowrap}
.fbtn:hover{border-color:#444;color:var(--fg)}
.fbtn.open{border-color:var(--accent);color:var(--fg)}
.fbtn .fc{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
@media (max-width:560px){.fbtn .fl{display:none}.fbtn{padding:0 15px}}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px;padding:2px}
.quick::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tg{height:36px;padding:0 14px;border-radius:999px;border:1px solid #2c2c2c;background:#1f1f1f;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.tg:hover{border-color:#4a4a4a;color:var(--fg)}
.tg .cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tg.on{background:rgba(95,208,106,.12);border-color:var(--accent);color:var(--accent)}
.tg.on .cnt{color:rgba(95,208,106,.7)}
.tg:disabled{opacity:.35;cursor:default}
.tg .ck{display:none}
.tg.on .ck{display:block}
.fpanel{border-radius:14px;background:#151515;border:1px solid #262626;overflow:hidden;animation:fpin .25s ease}
@keyframes fpin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fcols2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.fcol{padding:22px 24px;border-right:1px solid #232323;display:grid;gap:12px;align-content:start;min-width:0}
.fcol:last-child{border-right:0}
.fcol h3{margin:0;font-size:14px;font-weight:600;color:var(--fg-2)}
.radio{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid transparent;font-size:14px;color:var(--fg-2);text-align:left}
.radio:hover{background:#1d1d1d;color:var(--fg)}
.radio i{width:18px;height:18px;border-radius:50%;border:2px solid #4a4a4a;flex:none;display:grid;place-items:center}
.radio.on{background:rgba(95,208,106,.08);border-color:rgba(95,208,106,.35);color:var(--fg)}
.radio.on i{border-color:var(--accent)}
.radio.on i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.radio .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.radio:disabled{opacity:.35;cursor:default}
.ffoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid #232323;background:#121212}
.ffoot .btn{height:42px}
.linkb{font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.linkb:hover{color:var(--fg)}
@media (max-width:820px){.fcols2{grid-template-columns:1fr}.fcol{border-right:0;border-bottom:1px solid #232323}.fcol:last-child{border-bottom:0}}
.factive{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.factive > span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-radius:999px;border:1px solid #333;background:#232323;font-size:13px;color:var(--fg)}
.chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip:hover .x{background:#3a3a3a;color:var(--fg)}
.reset{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.reset:hover{background:#222;color:var(--fg)}

.sec{margin-top:80px}
.sec + .sec{margin-top:64px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.sec-h h2{margin:0;font-size:clamp(22px,2.4vw,28px);font-weight:600;letter-spacing:-.01em}
.sec-h .arr{width:32px;height:32px;display:grid;place-items:center;color:var(--fg-2);border-radius:50%}
.sec-h .arr:hover{background:#222;color:var(--fg)}
.sec-h .arr:disabled{opacity:.3;cursor:default;background:none}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 6*28px)/7);gap:28px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
.row.wide{grid-auto-columns:calc((100% - 3*28px)/4)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:24px 28px}
@media (max-width:1000px){.row{grid-auto-columns:calc((100% - 3*20px)/4);gap:20px}.row.wide{grid-auto-columns:calc((100% - 20px)/2)}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}
@media (max-width:560px){.row{grid-auto-columns:40%;gap:14px}.row.wide{grid-auto-columns:78%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}}

.card{display:grid;gap:10px;min-width:0}
.card > *{min-width:0}
[hidden]{display:none!important}
.cover{position:relative;border-radius:8px;overflow:hidden;background:var(--ph);aspect-ratio:3/4;max-width:100%}
.wide .cover{aspect-ratio:3/2}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.wide .cover img{object-position:center 22%}
.card:hover .cover img{transform:scale(1.04)}
.cover .fav{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.card .nm{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .du{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;display:flex;gap:8px}
.card .du .kp{color:var(--fg-2)}

.rec{margin-top:80px}
.rec .sec-h .sub{font-size:14px;color:var(--muted);margin-top:4px}
.rtrack{--h:clamp(220px,24vw,300px);display:flex;gap:14px;height:var(--h);overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:3px;margin:-3px}
.rtrack::-webkit-scrollbar{display:none}
.ri{position:relative;flex:0 0 calc(var(--h)*2/3);height:100%;border-radius:10px;overflow:hidden;background:var(--ph);cursor:pointer;transition:flex-basis .45s cubic-bezier(.2,.7,.2,1),box-shadow .3s;isolation:isolate;outline:none}
.ri > img.pp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.ri .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.55) saturate(1.2);opacity:0;transition:opacity .35s;z-index:-1}
.ri .side{position:absolute;right:0;top:0;height:100%;aspect-ratio:2/3;object-fit:cover;opacity:0;transition:opacity .35s;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%)}
.ri .ov{position:absolute;inset:0;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;background:linear-gradient(90deg,rgba(10,10,10,.85) 0%,rgba(10,10,10,.4) 55%,transparent 80%),linear-gradient(0deg,rgba(10,10,10,.6),transparent 50%);opacity:0;transition:opacity .35s .1s;pointer-events:none}
.ri .ov .tt{font-size:clamp(24px,2.6vw,36px);font-weight:800;line-height:1;letter-spacing:-.02em;max-width:11ch;text-wrap:balance;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.ri .bdg{display:flex;flex-wrap:wrap;gap:8px}
.ri .bdg span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:12px;font-weight:600;color:#eee;white-space:nowrap}
.ri .bdg svg{color:var(--star)}
.ri .bdg .nw{color:var(--accent-ink);background:var(--accent)}
.ri.on{flex-basis:calc(var(--h)*16/9);box-shadow:0 0 0 1px var(--accent)}
.ri.on > img.pp{opacity:0}
.ri.on .bg,.ri.on .side,.ri.on .ov{opacity:1}
.ri:not(.on):hover > img.pp{transform:scale(1.03);transition:transform .3s}
.ri:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.rinfo{margin-top:18px;min-height:96px;max-width:620px}
.rinfo .mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;font-weight:600;color:var(--fg-2)}
.rinfo .mt i{width:4px;height:4px;border-radius:50%;background:#666}
.rinfo p{margin:8px 0 0;font-size:16px;line-height:1.55;color:#e4e4e4}
.rinfo .ra{display:flex;gap:10px;margin-top:16px}
.rinfo .btn{height:40px;min-width:0;padding:0 18px}
.rinfo.fade{animation:rfade .35s ease}
@keyframes rfade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:640px){.rtrack{--h:200px}.ri.on{flex-basis:min(calc(var(--h)*16/9),calc(100vw - 80px))}.ri .ov{padding:14px 16px}.ri .bdg span:nth-child(2){display:none}}
.ad{margin-top:64px;position:relative;isolation:isolate;overflow:hidden;border-radius:12px;min-height:clamp(180px,17vw,220px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;padding:clamp(24px,3.4vw,44px)}
.ad .lbl{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 6px;z-index:2}
.ad .eb{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ad h3{margin:8px 0 8px;font-size:clamp(22px,2.8vw,34px);line-height:1.08;letter-spacing:-.02em;font-weight:800;max-width:18ch;text-wrap:balance}
.ad p{margin:0 0 20px;font-size:14px;max-width:46ch;line-height:1.55}
.ad .btn{min-width:0}
.ad-sub{background:radial-gradient(120% 140% at 100% 0%,#1f5a2a 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,#0d2a14 0%,transparent 60%),#0c130e;border:1px solid #1e3a24}
.ad-sub .eb{color:var(--accent)}
.ad-sub p{color:#b9c9bc}
.ad-sub .price{display:inline-flex;align-items:baseline;gap:6px;margin-left:14px;color:#dfe9e1;font-size:14px}
.ad-sub .price s{color:#7c8b7f}
.stack{position:relative;width:min(320px,34vw);height:170px}
.stack img{position:absolute;bottom:0;width:112px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.stack img:nth-child(1){left:0;transform:rotate(-8deg) translateY(6px)}
.stack img:nth-child(2){left:calc(50% - 56px);z-index:2;width:124px}
.stack img:nth-child(3){right:0;transform:rotate(8deg) translateY(6px)}
.ad-doc{background:radial-gradient(110% 140% at 100% 100%,#4a3514 0%,transparent 55%),radial-gradient(80% 120% at 0% 0%,#1d1710 0%,transparent 60%),#121110;border:1px solid #3a2e1c}
.stack.two img:nth-child(1){left:24px;transform:rotate(-6deg) translateY(4px)}
.stack.two img:nth-child(2){left:auto;right:24px;transform:rotate(5deg)}
.ad-doc .eb{color:#f2c46b}
.ad-doc p{color:#c9c9c9}
.ad-watch{background:linear-gradient(120deg,#1b1530 0%,#14141c 50%,#101010 100%);border:1px solid #2a2540}
.ad-watch .eb{color:#b8a6ff}
.ad-watch p{color:#bdb8cf}
.ad-watch .btn-w{background:#ece8ff;color:#15122a}
.avs{display:flex}
.avs span{width:56px;height:56px;border-radius:50%;margin-left:-14px;border:3px solid #15131f;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff}
.avs span:first-child{margin-left:0}
@media (max-width:700px){.ad{grid-template-columns:1fr}.stack,.avs{display:none}.ad-sub .price{display:flex;margin:12px 0 0}}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

.mhero{position:relative;isolation:isolate;overflow:hidden}
.mhero .bd{position:absolute;inset:-60px;z-index:-2;background-size:cover;background-position:center;filter:blur(48px) saturate(1.15);opacity:.45;transform:scale(1.1)}
.mhero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,20,20,.35) 0%,rgba(20,20,20,.75) 60%,var(--bg) 100%),linear-gradient(90deg,rgba(20,20,20,.6) 0%,transparent 70%)}
.mhero .wrap{padding-block:40px 96px}
.mgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:end}
.mposter{width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);background:var(--ph)}
.mposter img{width:100%;height:100%;object-fit:cover;display:block}
.mhero h1{margin:0;font-size:clamp(40px,5.6vw,64px);line-height:1.02;letter-spacing:-.02em;font-weight:700;max-width:14ch;text-wrap:balance;color:#f0f0f0}
.morig{margin-top:8px;font-size:15px;color:var(--muted)}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:16px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.mmeta .st{display:inline-flex;align-items:center;gap:5px;color:var(--fg);font-weight:600}
.mmeta .st svg{color:var(--star)}
.mmeta .v{color:var(--muted)}
.mmeta .dot{width:4px;height:4px;border-radius:50%;background:var(--fg-2)}
.mmeta .bar{width:1px;height:12px;background:#555}
.mdesc{margin:18px 0 0;max-width:56ch;font-size:14px;line-height:1.7;color:var(--fg-2)}
.mdesc .more{color:var(--accent);font-weight:600;font-size:14px}
.mbtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{height:44px;min-width:136px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s}
.btn-o{border:1px solid #6a6a6a}
.btn-o:hover{background:rgba(255,255,255,.06)}
.btn-g{background:var(--accent);color:var(--accent-ink)}
.btn-g:hover{background:#6fdc79}
.ibtns{display:flex;gap:12px;margin-top:20px}
.ib{width:48px;height:48px;border-radius:10px;background:#1d1d1d;border:1px solid #2a2a2a;display:grid;place-items:center;color:#d6d6d6;transition:background .15s,color .15s,border-color .15s}
.ib:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ib.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#dislikeb:hover,#dislikeb.on{background:#e8675a;color:#1a0a08;border-color:#e8675a}
@media (max-width:820px){.mgrid{grid-template-columns:1fr;gap:28px;align-items:start}.mposter{width:200px}.mhero .wrap{padding-block:24px 56px}}

.mstack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.mp{background:var(--panel);border:1px solid #222;border-radius:10px;padding:clamp(20px,3.6vw,40px)}
.mp-t{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;font-weight:500;color:var(--muted)}

function setRec(key,i,focus){
  const R=RECS[key], tr=document.getElementById("rt-"+key); if(!R||!tr) return;
  const items=[...tr.querySelectorAll(".ri")];
  R.idx=(i+items.length)%items.length;
  items.forEach((el,k)=>{ const on=k===R.idx; el.classList.toggle("on",on); el.setAttribute("aria-selected",on); el.tabIndex=on?0:-1; });
  const it=items[R.idx];
  setTimeout(()=>{ const left=it.offsetLeft - tr.offsetLeft - 3; if(left<tr.scrollLeft || left+it.offsetWidth>tr.scrollLeft+tr.clientWidth) tr.scrollTo({left:Math.max(0,left-14)}); },60);

function bindRec(key){
  const tr=document.getElementById("rt-"+key); if(!tr) return;

  tr.addEventListener("click",e=>{ const it=e.target.closest(".ri"); if(!it) return; const i=+it.dataset.ri;
    if(i===RECS[key].idx) location.hash="film-"+it.dataset.id; else setRec(key,i); });
  if(fine) tr.addEventListener("mouseover",e=>{ const it=e.target.closest(".ri"); if(!it||+it.dataset.ri===RECS[key].idx) return;
    clearTimeout(recTimer); recTimer=setTimeout(()=>setRec(key,+it.dataset.ri),220); });
  tr.addEventListener("mouseleave",()=>clearTimeout(recTimer));
  tr.addEventListener("keydown",e=>{ const R=RECS[key]; if(e.key==="ArrowRight"){e.preventDefault();setRec(key,R.idx+1,true);} else if(e.key==="ArrowLeft"){e.preventDefault();setRec(key,R.idx-1,true);} else if(e.key==="Enter"){ location.hash="film-"+R.list[R.idx].id; } });
}

function grad(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; const a=h%360; return `linear-gradient(135deg,hsl(${a} 32% 34%),hsl(${(a+40)%360} 30% 22%))`; }
function similar(f){
  return FILMS.filter(x=>x.id!==f.id).map(x=>({x,s:x.g.filter(g=>f.g.includes(g)).length*2+(x.c.some(c=>f.c.includes(c))?1:0)+(Math.abs(x.y-f.y)<10?.5:0)})).sort((a,b)=>b.s-a.s).map(o=>o.x);
}
function renderFilm(id){

      <div><div class="k">${ic('<path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/>')}Рейтинги</div><div class="two">${kp}${imdb}</div></div>
      <div><div class="k">${ic('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>')}Жанры</div><div class="tags">${f.g.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
      <div><div class="k">${ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')}Страна</div><div class="tags">${f.c.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
      <div><div class="k">Режиссёр</div><div class="plist">${f.d.map(n=>person(n,"Режиссёр")).join("")}</div></div>

      ${f.aw.length?`<div><div class="k">Награды</div><ul class="clean aw">${f.aw.map(a=>`<li><span class="yr">${a.y}</span><span>${esc(a.e)} · ${esc(a.c)}</span><span class="${a.w==="win"?"win":"nom"}">${a.w==="win"?"победа":"номинация"}</span></li>`).join("")}</ul></div>`:""}
      ${f.facts.length?`<div><div class="k">Интересные факты</div><ul class="clean facts">${f.facts.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}

    </section>


    <section class="mp" id="rvs">
      <h2 class="mp-t">Отзывы зрителей</h2>
      <div class="rvwrap">

          <div class="bars">${[5,4,3,2,1].map(k=>{const n=rv.filter(r=>r.s===k).length;return `<div><span>${k}</span><i style="--w:${rv.length?n/rv.length*100:0}%"></i><span>${n}</span></div>`;}).join("")}</div>`
          :`<div class="cntl" style="margin:0">Пока без оценок</div>`}

          </form>
          ${rv.length?rv.slice(rp*2,rp*2+2).map((r,k)=>{const key=id+":"+(rp*2+k); const hn=(r.t.length%7)+2+(helpful.has(key)?1:0);
            return `<article class="review"><div class="rh"><span class="ra">${ini(r.n)}</span><div><b>${esc(r.n)}</b><small>${esc(r.d)}</small></div>${stars(r.s,15)}</div>
              <p>${esc(r.t)}</p>
              <div class="rf"><button class="help${helpful.has(key)?" on":""}" data-help="${key}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 10.5A1.5 1.5 0 0 1 3.5 9h2A1.5 1.5 0 0 1 7 10.5v9A1.5 1.5 0 0 1 5.5 21h-2A1.5 1.5 0 0 1 2 19.5zM9 10.2c0-.5.2-1 .5-1.4L14 3.2c.6-.7 1.7-.7 2.3 0 .4.4.5 1 .4 1.6L15.8 9H20a2 2 0 0 1 2 2.3l-1.2 7.2A3 3 0 0 1 17.8 21H11a2 2 0 0 1-2-2z"/></svg>Полезно · ${hn}</button></div></article>`;}).join("")
          :`<div class="empty"><b>Отзывов пока нет</b>Посмотрели? Расскажите, кому подойдёт этот фильм.</div>`}
          ${pages>1?`<div class="rpager"><span>${rp+1} из ${pages}</span><button class="rb" id="rprev" aria-label="Предыдущие отзывы">${AL}</button><button class="rb" id="rnext" aria-label="Следующие отзывы">${AR}</button></div>`:""}
        </div>

  $("#more").onclick=()=>{ $("#mdesc").textContent=f.syn; };

  $("#likeb").onclick=()=>{ if(liked.has(id)) liked.delete(id); else { liked.add(id); disliked.delete(id); } st.set("liked",[...liked]); st.set("disliked",[...disliked]); keep(()=>renderFilm(id)); };
  $("#dislikeb").onclick=()=>{ if(disliked.has(id)) disliked.delete(id); else { disliked.add(id); liked.delete(id); } st.set("liked",[...liked]); st.set("disliked",[...disliked]); keep(()=>renderFilm(id)); };
  bindRec("sim");
  let score=5; const form=$("#rform");
  $("#addrv").onclick=()=>{ form.hidden=!form.hidden; if(!form.hidden) $("#rt").focus(); };

  $("#rcancel").onclick=()=>{ form.hidden=true; };
  $("#spick").onclick=e=>{ const b=e.target.closest("[data-s]"); if(!b) return; score=+b.dataset.s; [...$("#spick").children].forEach((x,i)=>x.classList.toggle("on",i<score)); };
  form.onsubmit=e=>{ e.preventDefault(); const t=$("#rt").value.trim(); if(t.length<3){ $("#rerr").hidden=false; $("#rt").focus(); return; }
    (reviews[id]=reviews[id]||[]).unshift({n:$("#rn").value.trim()||"Зритель",d:new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"}),s:score,t});
    st.set("reviews",reviews); rp=0; keep(()=>renderFilm(id)); document.getElementById("rvs").scrollIntoView({behavior:"smooth",block:"start"}); toast("Отзыв опубликован"); };
  $("#rprev")&&($("#rprev").onclick=()=>{ rp=(rp-1+pages)%pages; keep(()=>renderFilm(id)); });
  $("#rnext")&&($("#rnext").onclick=()=>{ rp=(rp+1)%pages; keep(()=>renderFilm(id)); });

function keep(fn){ const y=scrollY; fn(); window.scrollTo(0,y); }

function route(){
  const h=location.hash.slice(1)||"home";
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===h));
  if(h.startsWith("film-")){ rp=0; renderFilm(h.slice(5)); }
  else if(h==="favorites") renderFav();
  else if(h==="about") renderAbout();
  else renderHome(h==="docs"?"docs":h==="feature"?"feature":null);
  window.scrollTo(0,0); onScroll();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  const inFooter=!!b.closest(".foot");
  if(b.dataset.scroll){ const r=document.getElementById(b.dataset.scroll); r.scrollBy({left:r.clientWidth*.86}); if(r.scrollLeft+r.clientWidth>=r.scrollWidth-4) r.scrollTo({left:0}); return; }
  if(b.dataset.rec){ const [k,d]=b.dataset.rec.split(":"); setRec(k,RECS[k].idx + +d); return; }
  if(b.dataset.recfav){ const id=b.dataset.recfav; fav.has(id)?fav.delete(id):fav.add(id); st.set("fav",[...fav]); toast(fav.has(id)?"Добавлено в избранное":"Убрано из избранного"); recInfo(b.dataset.rk); return; }
  if(b.hasAttribute("data-soon")){ toast("Появится в следующей версии"); return; }
  if(b.hasAttribute("data-apply")){ showFilters=false; renderFinder(); $("#results").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(b.hasAttribute("data-reset")){ const k=F.kind; F={q:"",genres:[],dur:null,country:null,kind:k,dec:null}; if($("#q")){ $("#q").value=""; renderFinder(); renderResults(); } return; }
  if(b.closest(".seg")&&b.hasAttribute("data-kind")){ const k=b.dataset.kind; location.hash = k==="docs"?"docs":k==="feature"?"feature":"home"; return; }
  let changed=true;
  if(b.dataset.rm){ const k=b.dataset.rm; if(k.startsWith("g:")) F.genres=F.genres.filter(g=>g!==k.slice(2)); else F[k]=null; }
  else if(b.hasAttribute("data-genre")){ const g=b.dataset.genre; if(inFooter) F.genres=[g]; else F.genres=F.genres.includes(g)?F.genres.filter(x=>x!==g):[...F.genres,g]; }
  else if(b.hasAttribute("data-dur")){ F.dur = b.dataset.dur||null; }
  else if(b.hasAttribute("data-dec")){ F.dec = b.dataset.dec||null; }
  else if(b.hasAttribute("data-country")){ F.country = F.country===b.dataset.country?null:b.dataset.country; }
  else changed=false;
  if(!changed) return;
  if(inFooter){ if(location.hash&&location.hash!=="#home"){ F.kind=null; location.hash="home"; return; } }
  if(!$("#results")){ location.hash="home"; return; }
  renderFinder(); renderResults();
  if(inFooter) $(".finder").scrollIntoView({behavior:"smooth"});
});
window.addEventListener("resize",updateArrows);
function onScroll(){
  const y=window.scrollY, hdr=$(".hdr"); hdr.classList.toggle("stuck",y>8);
  const fin=$(".finder"); let show;
  if(fin){ show = fin.getBoundingClientRect().bottom < hdr.offsetHeight; } else show = true;
  const b=$("#sbtn"); if(show) b.removeAttribute("data-hide"); else b.setAttribute("data-hide","");
  b.tabIndex = show?0:-1;
}
window.addEventListener("scroll",onScroll,{passive:true});
$("#sbtn").addEventListener("click",()=>{
  const go=()=>{ const fin=$(".finder"); if(!fin) return; window.scrollTo({top:fin.getBoundingClientRect().top+scrollY-$(".hdr").offsetHeight-16,behavior:"smooth"}); setTimeout(()=>$("#q")&&$("#q").focus({preventScroll:true}),350); };
  if($(".finder")) go(); else { location.hash="home"; setTimeout(go,60); }
});
window.addEventListener("hashchange",route);
syncFav(); route();
</script>
